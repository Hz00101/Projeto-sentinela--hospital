<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midia-indoor</title>
   <style>
    /* ================================
       CONFIGURAÇÕES GERAIS
    ================================= */

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #eef2f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        color: #263238;
    }

    /* ================================
       CONTAINER DA TV
    ================================= */

    .tv-container {
        display: flex;
        width: 95vw;
        height: 90vh;
        gap: 18px;
    }

    /* ================================
       PAINEL ESQUERDO
    ================================= */

    .left-panel {
        display: flex;
        flex-direction: column;
        width: 35%;
        gap: 18px;
    }

    /* ================================
       CAIXAS
    ================================= */

    .box {
        background: #ffffff;
        border: 1px solid #d9e1e5;
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;

        box-shadow: 0 4px 15px rgba(38, 50, 56, 0.08);
    }

    .box-title {
        color: #234b5c;
        font-size: 2.2vw;
        font-weight: 600;
        text-transform: uppercase;
        margin-bottom: 12px;
        letter-spacing: 1px;
    }

    /* ================================
       LOCAL / GUICHÊ
    ================================= */

    .local-box {
        flex: 1;
        border-top: 5px solid #5f8f9f;
    }

    .local-number {
        color: #315d6d;
        font-size: 9vw;
        font-weight: bold;
        line-height: 1;
    }

    .local-type {
        color: #60737c;
        font-size: 1.8vw;
        font-weight: 600;
        margin-top: 6px;
        text-transform: uppercase;
    }

    /* ================================
       HISTÓRICO
    ================================= */

    .history-box {
        flex: 1;
        justify-content: flex-start;
        align-items: flex-start;
        border-top: 5px solid #8fa3ab;
    }

    .history-box .box-title {
        font-size: 1.8vw;
        align-self: center;
        color: #234b5c;
    }

    #history-list {
        list-style: none;
        width: 100%;
        color: #455a64;
        font-size: 1.5vw;
        font-weight: 600;
        text-align: left;
    }

    #history-list li {
        margin-bottom: 8px;
        border-bottom: 1px solid #dfe5e8;
        padding: 8px 5px;
    }

    /* ================================
       PACIENTE
    ================================= */

    .patient-box {
        flex: 3;
        border-top: 6px solid #315d6d;
        background: #ffffff;
    }

    .patient-name {
        color: #234b5c;
        font-size: 6.5vw;
        font-weight: bold;
        line-height: 1.2;
        word-break: break-word;
    }

    /* ================================
       LOGO
    ================================= */

    .logo-box {
        flex: 1;
        background: #f8fafb;
        border-top: 5px solid #8fa3ab;
    }

    .logo-text {
        color: #315d6d;
        font-size: 3.5vw;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    /* ================================
       ANIMAÇÃO DE CHAMADA
    ================================= */

    @keyframes flash {
        0%, 100% {
            opacity: 1;
        }

        50% {
            opacity: 0.35;
        }
    }

    .flash {
        animation: flash 0.5s ease 3;
    }

    /* ================================
       RESPONSIVIDADE
    ================================= */

    @media (max-width: 900px) {

        .tv-container {
            width: 96vw;
            height: 92vh;
            gap: 12px;
        }

        .left-panel {
            width: 38%;
            gap: 12px;
        }

        .box {
            padding: 15px;
        }

        .box-title {
            font-size: 3vw;
        }

        .history-box .box-title {
            font-size: 2.5vw;
        }

        #history-list {
            font-size: 2vw;
        }

        .local-type {
            font-size: 2.3vw;
        }

        .patient-name {
            font-size: 6vw;
        }

        .logo-text {
            font-size: 3vw;
        }
    }
</style>
</head>
<body>
    <!--Estrutura  da tela  da TV criada para exibir o local e o nome do paciente chamado-->
    <div class="tv-container">
        <div class="left-panel">
            <div class="box local-box">
                <div class="box-title" id="local-tipo">GUICHE</div>
                <div class="local-number" id="local-number">----</div>
            </div>

            <div class="box history-box">
                <div class="box-title">ULTIMAS CHAMADAS</div>
                <ul id="history-list"></ul>
            </div>
        </div>
        <div class="right-panel">
            <div class="box patient-box">
                <div class="box-title">PACIENTE</div>
                <div class="patiente-name" id="patient-name">AGUARDANDO...</div>
                <div>
                    <div class="box logo-box">
                        <div class="logo-text"><img src="/hospital.avif" width="100">sistema hospitalar </div>
                    </div>
                </div>
            </div>

        <script>
            let ultimold = null;
            //funçaõ criada para buscar a chamada atual  e o historico real da tv em tempo real 
            function atualizar() {
                fetch("/tv/chamada")
                .then(r => r.json())
                .then(data => {
                    const chamada = data.chamada;
                    const historico = data.historico || [];
                     
                    if(chamada) {
                        document.getElementById("local-tipo").innerText = chamada.localTipo || "GHICHE";
                        document.getElementById("local-numero").innerText = chamada.localNumero || "--";
                        document.getElementById("patient-name").innerText = chamada.paciente || "AGUARDANDO...";

                        // flash visual  quando ha chamada nova 
                        if (chamada.id !==ultimoID) {
                            ultimoID = chamada.id;
                            const patientBox = document.querySelector(".patient-box");
                            patientBox.classList.remove("flash");
                            void patientBox.offsetWidth; //reflow
                            patientBox.classList.add("flash");
                        }
                    }
                    // historico
                    const list = document.getElementById("history-list");
                    list.innerHTML = "";
                    historico.slice(0, 4).forEach(h => {
                        const li = document.createElement("li");
                        const tipo = h.localTipo ? h.localTipo.substring(0,4) : "GUIC";
                        li.innerText= `${tipo}. ${h.localNumero} - ${paciente}`;
                        list.appendChild(li);
                    });
                })
                .catch(err => console.log("Erro ao buscar chamada:", err));
            }

            //polling a cada 2 segundos 
            atualizar();
            setInterval(atualizar, 2000);

        </script>




</body>

</html>
